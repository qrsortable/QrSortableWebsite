<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QrSortable - Smart Storage Labels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Itim', 'cursive', 'sans-serif'],
            },
            colors: {
              brand: {
                yellow: '#FDB623',
                dark: '#1a1a1a',
                gray: '#2d2d2d',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Itim', cursive;
      }
      /* Match the provided image with thin golden concentric arcs */
      .bg-abstract-dark {
        background-color: #1a1a1a;
        background-image: 
          radial-gradient(circle at 100% 0%, transparent 39.9%, rgba(253, 182, 35, 0.12) 40%, transparent 40.2%),
          radial-gradient(circle at 100% 0%, transparent 54.9%, rgba(253, 182, 35, 0.08) 55%, transparent 55.2%),
          radial-gradient(circle at 100% 0%, transparent 69.9%, rgba(253, 182, 35, 0.05) 70%, transparent 70.2%),
          radial-gradient(circle at 0% 100%, transparent 29.9%, rgba(253, 182, 35, 0.12) 30%, transparent 30.2%),
          radial-gradient(circle at 0% 100%, transparent 44.9%, rgba(253, 182, 35, 0.08) 45%, transparent 45.2%),
          radial-gradient(circle at 0% 100%, transparent 59.9%, rgba(253, 182, 35, 0.05) 60%, transparent 60.2%),
          linear-gradient(135deg, #1f1f1f 0%, #0f0f0f 100%);
        position: relative;
        overflow: hidden;
      }

      @keyframes drift {
        from { transform: translateY(0px) translateX(0px); opacity: 0.1; }
        to { transform: translateY(-40px) translateX(20px); opacity: 0.4; }
      }

      .floating-dot {
        position: absolute;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        animation: drift var(--duration) linear infinite alternate;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-[#FDB623] selection:text-black">
    <div id="root"></div>
  </body>
</html>
